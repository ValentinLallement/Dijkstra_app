<!DOCTYPE html>

<html>

<head>

    <title>Itinéraire</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

    
    <div class="container_it">
        <div class="gauche">
           
            <button class="home-btn" onclick="window.location.href='{{ url_for('accueil') }}'">


                <div class="button-box">
                    <span class="button-elem">
                    <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                        <path
                        d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                        ></path>
                    </svg>
                    </span>
                    <span class="button-elem">
                    <svg viewBox="0 0 46 40">
                        <path
                        d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                        ></path>
                    </svg>
                    </span>
                </div>
                </button>

            <div class="sidebar" id="sidebar">
                <button class="toggle-btn" onclick="toggleSidebar()">
                    ☰
                </button>
                
                <div class="form-container">
                    <p>Sélectionner votre itinéraire</p>
                    <form action="/api/itineraire" method="get" class="itineraire-form">
                        <div class="form-group1">
                            <label for="depart" style="margin-right: 10px ;">Départ</label>
                            <select id="depart" name="depart" class="input" required>
                                <option value="">Sélectionner un arrêt de départ</option>
                                <option value="A1" {% if depart == "A1" %}selected{% endif %}>A1</option>
                                <option value="A2" {% if depart == "A2" %}selected{% endif %}>A2</option>
                                <option value="A3" {% if depart == "A3" %}selected{% endif %}>A3</option>
                                <option value="A4" {% if depart == "A4" %}selected{% endif %}>A4</option>
                                <option value="A5" {% if depart == "A5" %}selected{% endif %}>A5</option>
                                <option value="A6" {% if depart == "A6" %}selected{% endif %}>A6</option>
                                <option value="A7" {% if depart == "A7" %}selected{% endif %}>A7</option>
                                <option value="A8" {% if depart == "A8" %}selected{% endif %}>A8</option>
                                <option value="B1" {% if depart == "B1" %}selected{% endif %}>B1</option>
                                <option value="B2" {% if depart == "B2" %}selected{% endif %}>B2</option>
                                <option value="B3" {% if depart == "B3" %}selected{% endif %}>B3</option>
                                <option value="B4" {% if depart == "B4" %}selected{% endif %}>B4</option>
                                <option value="B5" {% if depart == "B5" %}selected{% endif %}>B5</option>
                                <option value="B6" {% if depart == "B6" %}selected{% endif %}>B6</option>
                                <option value="C1" {% if depart == "C1" %}selected{% endif %}>C1</option>
                                <option value="C2" {% if depart == "C2" %}selected{% endif %}>C2</option>
                                <option value="C3" {% if depart == "C3" %}selected{% endif %}>C3</option>
                                <option value="C4" {% if depart == "C4" %}selected{% endif %}>C4</option>
                                <option value="C5" {% if depart == "C5" %}selected{% endif %}>C5</option>
                                <option value="C6" {% if depart == "C6" %}selected{% endif %}>C6</option>
                                <option value="C7" {% if depart == "C7" %}selected{% endif %}>C7</option>
                            </select>
                        </div>
                        <br>

                        <div class="form-group2">
                            <label for="arrivee" style="margin-right: 10px ;">Arrivée</label>
                            
                            <select id="arrivee" name="arrivee" class="input" required>
                                <option value="">Sélectionner un arrêt d'arrivée</option>
                                <option value="A1" {% if arrivee == "A1" %}selected{% endif %}>A1</option>
                                <option value="A2" {% if arrivee == "A2" %}selected{% endif %}>A2</option>
                                <option value="A3" {% if arrivee == "A3" %}selected{% endif %}>A3</option>
                                <option value="A4" {% if arrivee == "A4" %}selected{% endif %}>A4</option>
                                <option value="A5" {% if arrivee == "A5" %}selected{% endif %}>A5</option>
                                <option value="A6" {% if arrivee == "A6" %}selected{% endif %}>A6</option>
                                <option value="A7" {% if arrivee == "A7" %}selected{% endif %}>A7</option>
                                <option value="A8" {% if arrivee == "A8" %}selected{% endif %}>A8</option>
                                <option value="B1" {% if arrivee == "B1" %}selected{% endif %}>B1</option>
                                <option value="B2" {% if arrivee == "B2" %}selected{% endif %}>B2</option>
                                <option value="B3" {% if arrivee == "B3" %}selected{% endif %}>B3</option>
                                <option value="B4" {% if arrivee == "B4" %}selected{% endif %}>B4</option>
                                <option value="B5" {% if arrivee == "B5" %}selected{% endif %}>B5</option>
                                <option value="B6" {% if arrivee == "B6" %}selected{% endif %}>B6</option>
                                <option value="C1" {% if arrivee == "C1" %}selected{% endif %}>C1</option>
                                <option value="C2" {% if arrivee == "C2" %}selected{% endif %}>C2</option>
                                <option value="C3" {% if arrivee == "C3" %}selected{% endif %}>C3</option>
                                <option value="C4" {% if arrivee == "C4" %}selected{% endif %}>C4</option>
                                <option value="C5" {% if arrivee == "C5" %}selected{% endif %}>C5</option>
                                <option value="C6" {% if arrivee == "C6" %}selected{% endif %}>C6</option>
                                <option value="C7" {% if arrivee == "C7" %}selected{% endif %}>C7</option>
                            </select>
                        </div>

                        <br>
                        
                        <button type="submit" class="btn-rechercher">Rechercher</button>

                    </form>
                    
                </div>
            
            </div>
        </div>
        <div class="droite">
            <h1>Ligne 1</h1>

            <div class="image-container2" id="graphe-container">

                {% if resultat %}
                    <img
                        src="{{ url_for('static', path='images/resultat.png') }}"
                        alt="Ligne 1"
                        id="graphe"
                    >
                {% else %}
                    <img
                        src="{{ url_for('static', path='images/Graphe.png') }}"
                        alt="Ligne 1"
                        id="graphe"
                    >
                {% endif %}

                {% for nom, (x, y) in coordonnees.items() %}
                
                    <button
                        type="button"
                        class="arret"
                        data-arret="{{ nom }}"
                        data-x="{{ x }}"
                        data-y="{{ y }}"
                        title="{{ nom }}"
                    ></button>
                {% endfor %}

            </div>

            <div class="resultat">
                {% if resultat %}
                    <h2>Itinéraire trouvé</h2>

                    <p>
                        {% for i in resultat %}
                            {{ i }}
                        {% endfor %}
                    </p>

                    <p>
                        <strong>Temps total :</strong>
                        {{ temps_total }}
                    </p>
                {% endif %}
            </div>
        </div>
    </div>

</body>

</html>

<script>

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}



const image = document.getElementById("graphe");
const arrets = document.querySelectorAll(".arret");

function positionnerArrets() {

    const largeurAffichee = image.getBoundingClientRect().width;
    const hauteurAffichee = image.getBoundingClientRect().height;

    const largeurOriginale = image.naturalWidth;
    const hauteurOriginale = image.naturalHeight;

    if (
        largeurOriginale === 0 ||
        hauteurOriginale === 0 ||
        largeurAffichee === 0 ||
        hauteurAffichee === 0
    ) {
        return;
    }

    arrets.forEach(arret => {

        const x = Number(arret.dataset.x);
        const y = Number(arret.dataset.y);

        const xAffiche = x * largeurAffichee / largeurOriginale;
        const yAffiche = y * hauteurAffichee / hauteurOriginale;

        arret.style.left = `${xAffiche}px`;
        arret.style.top = `${yAffiche}px`;
    });
}


if (image.complete) {
    positionnerArrets();
} else {
    image.addEventListener("load", positionnerArrets);
}


window.addEventListener("resize", positionnerArrets);



const selectDepart = document.getElementById("depart");
const selectArrivee = document.getElementById("arrivee");
const formulaire = document.querySelector(".itineraire-form");

let departSelectionne = false;
let arriveeSelectionnee = false;

arrets.forEach(arret => {

    arret.addEventListener("click", function () {

        const nomArret = this.dataset.arret;

        if (!departSelectionne) {

            selectDepart.value = nomArret;

            departSelectionne = true;

            this.classList.add("depart-selectionne");

            console.log("Départ :", nomArret);

            return;
        }


        if (!arriveeSelectionnee) {

            if (nomArret === selectDepart.value) {

                alert(
                    "L'arrêt de départ et l'arrêt d'arrivée doivent être différents."
                );

                return;
            }

            selectArrivee.value = nomArret;

            arriveeSelectionnee = true;

            this.classList.add("arrivee-selectionnee");

            console.log("Arrivée :", nomArret);

            formulaire.submit();
        }

    });

});

</script>
