<!DOCTYPE html>

<html>

<head>

    <title>{{ ligne.nom }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}?v=2"
    >

    <style>
    </style>

</head>


<body>

    <div class="container_it">

        <div class="gauche">

            <button
                class="home-btn"
                onclick="window.location.href='{{ url_for('accueil') }}'"
            >

                <div class="button-box">

                    <span class="button-elem">

                        <svg
                            viewBox="0 0 46 40"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                            <path
                                d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                            ></path>

                        </svg>

                    </span>


                    <span class="button-elem">

                        <svg viewBox="0 0 46 40">

                            <path
                                d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
                            ></path>

                        </svg>

                    </span>

                </div>

            </button>


            <div
                class="sidebar2"
                id="sidebar"
            >

                <button
                    class="toggle-btn"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>


                <div class="lignes2">

                    <h2>Les lignes</h2>


                    <div class="ligne_tab">

                        <a
                            href="/api/itineraire"
                            class="ligne_lien"
                        >
                            Ligne 1
                        </a>


                        {% for ligne_i in lignes %}

                            {% if ligne_i.id != ligne.id %}

                                <a
                                    href="/api/itineraire_bis?ligne_id={{ ligne_i.id }}"
                                    class="ligne_lien"
                                >
                                    {{ ligne_i.nom }}
                                </a>

                            {% endif %}

                        {% endfor %}

                    </div>

                </div>

            </div>

        </div>


        <div class="droite">

            <h1>{{ ligne.nom }}</h1>


            <div class="graphe_import">

                <canvas id="graphe_import"></canvas>

            </div>


            <div class="resultat">

                {% if resultat %}

                    <h2>Itinéraire trouvé</h2>


                    <p>

                        {% for i in resultat %}

                            {{ i }}

                        {% endfor %}

                    </p>


                    <p>

                        <strong>
                            Temps total :
                        </strong>

                        {{ temps_total }}

                    </p>

                {% endif %}

            </div>

        </div>

    </div>



    <script>


        /* =====================================================
           SIDEBAR
        ===================================================== */

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList
                .toggle("collapsed");

        }


        const canvas =
            document.getElementById("graphe_import");


        const ctx =
            canvas.getContext("2d");


        const sommets =
            {{ sommets | tojson }};


        const aretes =
            {{ aretes | tojson }};


        const resultat =
            {{ resultat | tojson }};

        let sommetDepart =
            {{ depart | tojson }};


        let sommetArrivee =
            {{ arrivee | tojson }};


        let departSelectionne =
            sommetDepart !== null;


        let arriveeSelectionnee =
            sommetArrivee !== null;



        const graphe = {

            sommets: sommets,

            aretes: aretes

        };

        function trouverOrdreSommets(
            sommets,
            aretes
        ) {

            const voisins = {};


            for (const sommet of sommets) {

                voisins[sommet] = [];

            }


            for (const arete of aretes) {

                if (
                    voisins[arete.depart] &&
                    voisins[arete.arrivee]
                ) {

                    voisins[arete.depart].push(
                        arete.arrivee
                    );


                    voisins[arete.arrivee].push(
                        arete.depart
                    );

                }

            }


            let depart =
                sommets.find(
                    sommet =>
                        voisins[sommet].length === 1
                );


            if (depart === undefined) {

                depart = sommets[0];

            }


            const ordre = [];

            const visites = new Set();

            let actuel = depart;


            while (
                actuel !== undefined &&
                !visites.has(actuel)
            ) {

                ordre.push(actuel);

                visites.add(actuel);


                const prochain =
                    voisins[actuel].find(
                        voisin =>
                            !visites.has(voisin)
                    );


                actuel = prochain;

            }

            for (const sommet of sommets) {

                if (!visites.has(sommet)) {

                    ordre.push(sommet);

                }

            }


            return ordre;

        }

        function positionnerGraphe() {

            const largeurAffichee =
                canvas.getBoundingClientRect().width;


            const hauteurAffichee =
                canvas.getBoundingClientRect().height;


            if (
                largeurAffichee === 0 ||
                hauteurAffichee === 0
            ) {

                return;

            }


            canvas.width =
                largeurAffichee;


            canvas.height =
                hauteurAffichee;


            dessinerGraphe(
                graphe,
                sommetDepart,
                sommetArrivee,
                resultat
            );

        }

        function calculerPositions(
            sommets,
            largeur,
            hauteur
        ) {

            const ordre =
                trouverOrdreSommets(
                    sommets,
                    graphe.aretes
                );


            const positions = {};


            const margeX = 80;
            const margeY = 100;

            const espaceX = 130;
            const espaceY = 130;


            const nombreColonnes =
                Math.max(
                    1,
                    Math.floor(
                        (
                            largeur -
                            2 * margeX
                        ) / espaceX
                    )
                );


            ordre.forEach(
                (sommet, i) => {

                    const ligne =
                        Math.floor(
                            i /
                            nombreColonnes
                        );


                    let colonne =
                        i %
                        nombreColonnes;


                    if (ligne % 2 === 1) {

                        colonne =
                            nombreColonnes -
                            1 -
                            colonne;

                    }


                    
                    const decalageX =
                        (i % 2 === 0)
                            ? 0
                            : 25;


                    const decalageY =
                        (i % 2 === 0)
                            ? -20
                            : 20;


                    positions[sommet] = {

                        x:
                            margeX +
                            colonne *
                            espaceX +
                            decalageX,


                        y:
                            margeY +
                            ligne *
                            espaceY +
                            decalageY

                    };

                }
            );


            return positions;

        }

        function areteDansChemin(
            depart,
            arrivee,
            chemin
        ) {

            if (
                !chemin ||
                chemin.length < 2
            ) {

                return false;

            }


            for (
                let i = 0;
                i < chemin.length - 1;
                i++
            ) {

                const sommet1 =
                    chemin[i];


                const sommet2 =
                    chemin[i + 1];



                if (

                    (
                        depart === sommet1 &&
                        arrivee === sommet2
                    )

                    ||

                    (
                        depart === sommet2 &&
                        arrivee === sommet1
                    )

                ) {

                    return true;

                }

            }


            return false;

        }

        function dessinerGraphe(
            graphe,
            sommetDepart = null,
            sommetArrivee = null,
            chemin = null
        ) {

            const positions =
                calculerPositions(
                    graphe.sommets,
                    canvas.width,
                    canvas.height
                );


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (
                const arete of graphe.aretes
            ) {

                const depart =
                    positions[
                        arete.depart
                    ];


                const arrivee =
                    positions[
                        arete.arrivee
                    ];


                if (
                    !depart ||
                    !arrivee
                ) {

                    continue;

                }


                ctx.beginPath();


                ctx.moveTo(
                    depart.x,
                    depart.y
                );


                ctx.lineTo(
                    arrivee.x,
                    arrivee.y
                );



                if (
                    areteDansChemin(
                        arete.depart,
                        arete.arrivee,
                        chemin
                    )
                ) {

                    ctx.strokeStyle =
                        "red";

                    ctx.lineWidth =
                        6;

                }

                else {

                    ctx.strokeStyle =
                        "white";

                    ctx.lineWidth =
                        2;

                }


                ctx.stroke();



                

                ctx.fillStyle =
                    "black";


                ctx.font =
                    "16px Arial";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                

            }


            for (
                const sommet of graphe.sommets
            ) {

                const position =
                    positions[sommet];


                if (!position) {

                    continue;

                }


                ctx.beginPath();


                ctx.arc(
                    position.x,
                    position.y,
                    30,
                    0,
                    Math.PI * 2
                );



                if (
                    sommet === sommetDepart
                ) {

                    ctx.fillStyle =
                        "blue";

                }

                else if (
                    sommet === sommetArrivee
                ) {

                    ctx.fillStyle =
                        "red";

                }

                else {

                    ctx.fillStyle =
                        "white";

                }


                ctx.fill();


                ctx.strokeStyle =
                    "black";


                ctx.lineWidth =
                    2;


                ctx.stroke();


                ctx.fillStyle =
                    "black";


                ctx.font =
                    "bold 20px Arial";


                ctx.textAlign =
                    "center";


                ctx.textBaseline =
                    "middle";


                ctx.fillText(
                    sommet,
                    position.x,
                    position.y
                );

            }

        }


        function trouverSommetClique(
            x,
            y,
            positions
        ) {

            for (
                const sommet of graphe.sommets
            ) {

                const position =
                    positions[sommet];


                if (!position) {

                    continue;

                }


                const distance =
                    Math.sqrt(

                        (x - position.x) ** 2 +

                        (y - position.y) ** 2

                    );


                if (
                    distance <= 30
                ) {

                    return sommet;

                }

            }


            return null;

        }


        canvas.addEventListener(
            "click",
            function(event) {

                const rectangle =
                    canvas.getBoundingClientRect();


                const x =
                    event.clientX -
                    rectangle.left;


                const y =
                    event.clientY -
                    rectangle.top;


                const positions =
                    calculerPositions(
                        graphe.sommets,
                        canvas.width,
                        canvas.height
                    );


                const sommet =
                    trouverSommetClique(
                        x,
                        y,
                        positions
                    );


                if (
                    sommet === null
                ) {

                    return;

                }


                if (
                    !departSelectionne
                ) {

                    sommetDepart =
                        sommet;


                    departSelectionne =
                        true;


                    arriveeSelectionnee =
                        false;


                    dessinerGraphe(
                        graphe,
                        sommetDepart,
                        null,
                        null
                    );


                    console.log(
                        "Départ :",
                        sommetDepart
                    );


                    return;

                }


                if (
                    !arriveeSelectionnee
                ) {

        
                    if (
                        sommet === sommetDepart
                    ) {

                        alert(
                            "L'arrêt de départ et l'arrêt d'arrivée doivent être différents."
                        );


                        return;

                    }


                    sommetArrivee =
                        sommet;


                    arriveeSelectionnee =
                        true;


                    console.log(
                        "Arrivée :",
                        sommetArrivee
                    );


                    dessinerGraphe(
                        graphe,
                        sommetDepart,
                        sommetArrivee,
                        null
                    );

                    window.location.href =
                        `/api/itineraire_bis?ligne_id={{ ligne.id }}&depart=${encodeURIComponent(sommetDepart)}&arrivee=${encodeURIComponent(sommetArrivee)}`;


                    return;

                }

                sommetDepart =
                    sommet;


                sommetArrivee =
                    null;


                departSelectionne =
                    true;


                arriveeSelectionnee =
                    false;


                console.log(
                    "Reset du chemin"
                );


                console.log(
                    "Nouveau départ :",
                    sommetDepart
                );


                dessinerGraphe(
                    graphe,
                    sommetDepart,
                    null,
                    null
                );

            }
        );


        positionnerGraphe();

        window.addEventListener(
            "resize",
            positionnerGraphe
        );

    </script>

</body>

</html>
